<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GT1 Lab 9 — Đạo hàm một phía</title><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232563eb'/%3E%3Cpath d='M10 46 Q24 6 54 18' fill='none' stroke='white' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E"><style>
:root{
  --bg:#0f1419;--text:#e8f0f7;--muted:#a8b3bd;--line:#475569;
  --blue:#2563eb;--red:#dc2626;--green:#059669;--amber:#d97706;
  --panel:#18212b;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:820px;margin:0 auto;padding:16px}
h1{font-size:clamp(24px,6vw,40px);margin:0 0 8px}
.lead{font-size:clamp(16px,4vw,21px);color:var(--muted);margin:0 0 16px}
.card{background:var(--panel);border:1px solid #e2e8f0;border-radius:18px;padding:14px;margin:12px 0}
.math{font-family:"Times New Roman",serif}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button{font:inherit;font-weight:650;border:1px solid #475569;border-radius:12px;padding:12px 16px;background:#111820;color:var(--text);min-height:46px;cursor:pointer}
button.active{border-color:var(--blue);background:#eff6ff;color:#1d4ed8}
input[type=range]{width:100%;height:40px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat>div{background:#111820;border:1px solid #334155;border-radius:12px;padding:10px}
.label{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.value{font-size:clamp(22px,6vw,34px);font-weight:750;margin-top:2px}
.note{border-left:5px solid var(--blue);padding:10px 12px;background:#13243a;border-radius:8px;margin-top:12px}
.warn{border-left-color:var(--red);background:#341719}
.ok{border-left-color:var(--green);background:#102a22}
svg{width:100%;height:auto;display:block;background:#111820;border-radius:14px;border:1px solid #334155}
</style></head>
<body><main class="wrap">
<h1>GT1 Lab 9 — <span class="math">đạo hàm trái / phải</span></h1>
<p class="lead">Hàm <b class="math">f(x) = |x|</b> liên tục tại 0. Chọn các điểm <span class="math">x&lt;0</span> và <span class="math">x&gt;0</span> gần 0, quan sát thương số rồi dự đoán <span class="math">f'(0)</span> có tồn tại hay không.</p>

<div class="card">
  <div class="row">
    <button data-side="left" class="active">Phía trái x &lt; 0</button>
    <button data-side="right">Phía phải x &gt; 0</button>
  </div>
  <svg viewBox="0 0 760 360" aria-label="Đồ thị |x|">
    <line x1="60" y1="300" x2="700" y2="300" stroke="#94a3b8" stroke-width="3"/>
    <line x1="380" y1="30" x2="380" y2="330" stroke="#94a3b8" stroke-width="3"/>
    <path d="M 80 140 L 380 300 L 680 140" fill="none" stroke="#2563eb" stroke-width="5"/>
    <line id="sec" x1="380" y1="300" x2="380" y2="300" stroke="#d97706" stroke-width="3"/>
    <circle cx="380" cy="300" r="8" fill="#dc2626"/>
    <circle id="dot" r="10" fill="#059669"/>
    <text x="430" y="55" font-size="22" fill="#2563eb" font-family="Times New Roman">y = |x|</text>
    <text id="labL" x="90" y="55" font-size="20" fill="#dc2626" opacity="0" aria-hidden="true">phía trái: −1</text>
    <text id="labR" x="500" y="90" font-size="20" fill="#dc2626" opacity="0" aria-hidden="true">phía phải: +1</text>
  </svg>
  <label class="label" for="s">Đưa |x| về gần 0</label>
  <input id="s" type="range" min="0" max="100" value="15">
  <div class="stat">
    <div><div class="label">Quá trình</div><div id="proc" class="value math">x → 0⁻</div></div>
    <div><div class="label">Thương số [f(x)−f(0)]/x</div><div id="quot" class="value math">—</div></div>
  </div>
  <div class="label" style="margin-top:10px">Đoán trước khi mở kết luận</div>
  <div class="row">
    <button id="gYes">Có đạo hàm tại 0</button>
    <button id="gNo">Không có đạo hàm tại 0</button>
  </div>
</div>

<div class="note" id="note"><b>Việc của bạn:</b> vuốt từ trái rồi từ phải, quan sát thương số, rồi đoán.</div>
</main>
<script>
const sEl=document.getElementById('s'), sec=document.getElementById('sec'), dot=document.getElementById('dot');
const proc=document.getElementById('proc'), quot=document.getElementById('quot');
let side='left';
document.querySelectorAll('button[data-side]').forEach(b=>b.onclick=()=>{
  side=b.dataset.side;
  document.querySelectorAll('button[data-side]').forEach(x=>x.classList.toggle('active',x===b));
  render();
});
function X(x){return 380+x*150}
function Y(y){return 300-y*80}
function render(){
  const u=+sEl.value/100;
  const mag=1.8*(1-u)+0.05;
  const x=side==='left'?-mag:mag;
  const fx=Math.abs(x);
  const q=(fx-0)/x;
  sec.setAttribute('x1',X(0)); sec.setAttribute('y1',Y(0));
  sec.setAttribute('x2',X(x)); sec.setAttribute('y2',Y(fx));
  dot.setAttribute('cx',X(x)); dot.setAttribute('cy',Y(fx));
  proc.textContent=side==='left'?'x < 0':'x > 0';
  quot.textContent=revealed
    ? (q.toFixed(3)+' → '+(side==='left'?'−1':'+1'))
    : q.toFixed(3);
}
let revealed=false;
function reveal(okGuess){
  revealed=true;
  document.getElementById('labL').setAttribute('opacity','1');
  document.getElementById('labR').setAttribute('opacity','1');
  document.getElementById('labL').removeAttribute('aria-hidden');
  document.getElementById('labR').removeAttribute('aria-hidden');
  const note=document.getElementById('note');
  note.className='note warn';
  note.innerHTML=(okGuess?'<b>Đúng.</b> ':'<b>Chưa đúng.</b> ')+
    'Đạo hàm trái = −1, đạo hàm phải = +1. Vì −1 ≠ +1 nên f không khả vi tại 0, dù liên tục.';
  render();
}
document.getElementById('gYes').onclick=()=>reveal(false);
document.getElementById('gNo').onclick=()=>reveal(true);
sEl.oninput=render; render();
</script></body></html>
