<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GT1 Lab 4 — Giới hạn một phía</title><style>
:root{
  --bg:#ffffff;--text:#0f172a;--muted:#475569;--line:#cbd5e1;
  --blue:#2563eb;--red:#dc2626;--green:#059669;--amber:#d97706;
  --panel:#f8fafc;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:820px;margin:0 auto;padding:16px}
h1{font-size:clamp(24px,6vw,40px);margin:0 0 8px}
.lead{font-size:clamp(16px,4vw,21px);color:var(--muted);margin:0 0 16px}
.card{background:var(--panel);border:1px solid #e2e8f0;border-radius:18px;padding:14px;margin:12px 0}
.big{font-size:clamp(26px,7vw,44px);font-weight:700}
.math{font-family:"Times New Roman",serif}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button{font:inherit;font-weight:650;border:1px solid #cbd5e1;border-radius:12px;padding:12px 16px;background:white;min-height:46px;cursor:pointer}
button.active{border-color:var(--blue);background:#eff6ff;color:#1d4ed8}
input[type=range]{width:100%;height:40px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat>div{background:white;border:1px solid #e2e8f0;border-radius:12px;padding:10px}
.label{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.value{font-size:clamp(22px,6vw,34px);font-weight:750;margin-top:2px}
.note{border-left:5px solid var(--blue);padding:10px 12px;background:#eff6ff;border-radius:8px;margin-top:12px}
.warn{border-left-color:var(--red);background:#fef2f2}
.ok{border-left-color:var(--green);background:#ecfdf5}
svg{width:100%;height:auto;display:block;background:white;border-radius:14px;border:1px solid #e2e8f0}
.small{font-size:14px;color:var(--muted)}
hr{border:0;border-top:1px solid #e2e8f0;margin:18px 0}
</style></head>
<body><main class="wrap">
<h1>GT1 Lab 4 — Giới hạn một phía</h1>
<p class="lead">Cùng tiến tới <span class="math">x=0</span>, nhưng đi từ trái và phải có thể cho hai “đích” khác nhau.</p>

<div class="card">
<svg viewBox="0 0 760 430" aria-label="Đồ thị hai nhánh với giới hạn trái bằng 1 và phải bằng 3">
  <line x1="60" y1="350" x2="710" y2="350" stroke="#0f172a" stroke-width="3"/>
  <line x1="380" y1="40" x2="380" y2="395" stroke="#0f172a" stroke-width="3"/>
  <path d="M80 300 C180 300 290 280 380 250" fill="none" stroke="#2563eb" stroke-width="6"/>
  <path d="M380 120 C440 180 540 200 680 205" fill="none" stroke="#2563eb" stroke-width="6"/>
  <circle cx="380" cy="250" r="12" fill="white" stroke="#2563eb" stroke-width="5"/>
  <circle cx="380" cy="120" r="12" fill="white" stroke="#2563eb" stroke-width="5"/>
  <circle cx="380" cy="350" r="12" fill="#dc2626"/>
  <circle id="p" cx="250" cy="280" r="12" fill="#059669"/>
  <text x="400" y="118" font-size="24" fill="#dc2626">đích bên phải: 3</text>
  <text x="120" y="245" font-size="24" fill="#dc2626">đích bên trái: 1</text>
</svg>

<div class="row"><button id="BL">Từ trái → 0</button><button id="BR">Từ phải → 0</button></div>
<label class="label" for="s">Tiến trình</label><input id="s" type="range" min="0" max="100" value="0">
<div class="stat">
<div><div class="label">Quá trình</div><div id="proc" class="value math">x → 0⁻</div></div>
<div><div class="label">f(x) tiến tới</div><div id="dest" class="value math">1</div></div>
</div>
</div>

<div id="result" class="note warn"><b>Kết luận:</b> giới hạn trái = 1, giới hạn phải = 3. Vì 1 ≠ 3 nên <span class="math">lim x→0 f(x)</span> không tồn tại.</div>
</main>
<script>
const s=document.getElementById('s'),p=document.getElementById('p'),proc=document.getElementById('proc'),dest=document.getElementById('dest');
let side='L';
function setSide(q){side=q; s.value=0; document.getElementById('BL').classList.toggle('active',q==='L');document.getElementById('BR').classList.toggle('active',q==='R');render();}
document.getElementById('BL').onclick=()=>setSide('L'); document.getElementById('BR').onclick=()=>setSide('R'); s.oninput=render;
function bezier(P0,P1,P2,P3,u){
 const v=1-u;
 return v*v*v*P0 + 3*v*v*u*P1 + 3*v*u*u*P2 + u*u*u*P3;
}
function render(){
 const t=+s.value/100;
 if(side==='L'){
   const u=t; // từ trái tiến dần tới x=0
   const cx=bezier(80,180,290,380,u);
   const cy=bezier(300,300,280,250,u);
   p.setAttribute('cx',cx); p.setAttribute('cy',cy);
   proc.textContent='x → 0⁻';
   dest.textContent=(0.35+0.65*t).toFixed(2)+' → 1';
 }
 else{
   const u=1-t; // từ phải tiến dần về x=0
   const cx=bezier(380,440,540,680,u);
   const cy=bezier(120,180,200,205,u);
   p.setAttribute('cx',cx); p.setAttribute('cy',cy);
   proc.textContent='x → 0⁺';
   dest.textContent=(2.10+0.90*t).toFixed(2)+' → 3';
 }
}
setSide('L');
</script></body></html>
