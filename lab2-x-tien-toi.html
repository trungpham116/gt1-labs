<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GT1 Lab 2 — x tiến tới</title><style>
:root{
  --bg:#ffffff;--text:#0f172a;--muted:#475569;--line:#cbd5e1;
  --blue:#2563eb;--red:#dc2626;--green:#059669;--amber:#d97706;
  --panel:#f8fafc;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:820px;margin:0 auto;padding:16px}
h1{font-size:clamp(24px,6vw,40px);margin:0 0 8px}
.lead{font-size:clamp(16px,4vw,21px);color:var(--muted);margin:0 0 16px}
.card{background:var(--panel);border:1px solid #e2e8f0;border-radius:18px;padding:14px;margin:12px 0}
.big{font-size:clamp(26px,7vw,44px);font-weight:700}
.math{font-family:"Times New Roman",serif}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button{font:inherit;font-weight:650;border:1px solid #cbd5e1;border-radius:12px;padding:12px 16px;background:white;min-height:46px;cursor:pointer}
button.active{border-color:var(--blue);background:#eff6ff;color:#1d4ed8}
input[type=range]{width:100%;height:40px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat>div{background:white;border:1px solid #e2e8f0;border-radius:12px;padding:10px}
.label{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.value{font-size:clamp(22px,6vw,34px);font-weight:750;margin-top:2px}
.note{border-left:5px solid var(--blue);padding:10px 12px;background:#eff6ff;border-radius:8px;margin-top:12px}
.warn{border-left-color:var(--red);background:#fef2f2}
.ok{border-left-color:var(--green);background:#ecfdf5}
svg{width:100%;height:auto;display:block;background:white;border-radius:14px;border:1px solid #e2e8f0}
.small{font-size:14px;color:var(--muted)}
hr{border:0;border-top:1px solid #e2e8f0;margin:18px 0}
</style></head>
<body><main class="wrap">
<h1>GT1 Lab 2 — <span class="math">x → ?</span></h1>
<p class="lead">Chạm một nút rồi kéo thanh trượt. Mục tiêu: thấy <b>“x tiến tới” là một quá trình</b>, không phải thay ngay x bằng một giá trị.</p>

<div class="card">
  <div class="row">
    <button data-mode="left">x → a⁻</button>
    <button data-mode="right">x → a⁺</button>
    <button data-mode="pinf">x → +∞</button>
    <button data-mode="ninf">x → −∞</button>
  </div>
  <svg viewBox="0 0 760 260" aria-label="Trục số tương tác">
    <line x1="50" y1="135" x2="710" y2="135" stroke="#0f172a" stroke-width="4"/>
    <polygon points="710,135 695,127 695,143" fill="#0f172a"/>
    <polygon points="50,135 65,127 65,143" fill="#0f172a"/>
    <text x="370" y="195" font-size="34" fill="#dc2626" font-family="Times New Roman">a</text>
    <circle id="dot" cx="220" cy="135" r="16" fill="#2563eb"/>
    <circle id="core" cx="220" cy="135" r="5" fill="#facc15" stroke="#111827" stroke-width="2"/>
    <line x1="380" y1="110" x2="380" y2="160" stroke="#dc2626" stroke-width="4"/>
    <text id="caption" x="70" y="55" font-size="30" fill="#1d4ed8" font-weight="700">x → a⁻</text>
    <text x="45" y="205" font-size="26">−∞</text>
    <text x="685" y="205" font-size="26">+∞</text>
  </svg>
  <label class="label" for="s">Tiến trình</label>
  <input id="s" type="range" min="0" max="100" value="0">
  <div class="stat">
    <div><div class="label">Vị trí x</div><div id="xval" class="value math">a − 3.00</div></div>
    <div><div class="label">Đọc bằng lời</div><div id="words" class="value" style="font-size:20px">đi tới a từ bên trái</div></div>
  </div>
</div>

<div class="note"><b>Chốt:</b> <span class="math">x → a</span> mô tả <b>một quá trình tiến gần</b>. Ta chưa hỏi <span class="math">x = a</span>.</div>
</main>
<script>
const buttons=[...document.querySelectorAll('button[data-mode]')], s=document.getElementById('s'),
dot=document.getElementById('dot'), core=document.getElementById('core'), cap=document.getElementById('caption'),
xval=document.getElementById('xval'), words=document.getElementById('words');
let mode='left';
function setMode(m){
  mode=m; s.value=0; buttons.forEach(b=>b.classList.toggle('active',b.dataset.mode===m)); render();
}
buttons.forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));
s.addEventListener('input',render);
function render(){
  const t=+s.value/100; let cx=220, txt='', w='', c='';
  if(mode==='left'){cx=120+(366-120)*(0.08+0.92*t); txt='a − '+(2.98*(1-t)+0.02).toFixed(2); w='đi tới a từ bên trái'; c='x → a⁻';}
  if(mode==='right'){cx=640-(640-394)*(0.08+0.92*t); txt='a + '+(2.98*(1-t)+0.02).toFixed(2); w='đi tới a từ bên phải'; c='x → a⁺';}
  if(mode==='pinf'){cx=390+300*t; txt=(1+99*t).toFixed(1); w='đi rất xa về bên phải'; c='x → +∞';}
  if(mode==='ninf'){cx=370-300*t; txt=(-1-99*t).toFixed(1); w='đi rất xa về bên trái'; c='x → −∞';}
  dot.setAttribute('cx',cx); core.setAttribute('cx',cx); xval.textContent=txt; words.textContent=w; cap.textContent=c;
}
setMode('left');
</script></body></html>
